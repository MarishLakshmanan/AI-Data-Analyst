# Usage on the VPS:
#   cp .env.example .env   # fill in OPENROUTER_* and SNOWFLAKE_*
#   mkdir -p secrets && cp /path/to/rsa_key.p8 secrets/rsa_key.p8
#   docker compose up -d --build
#
# Ports (all optional, set in .env):
#   WEB_BIND  host interface for the dashboard   (default 127.0.0.1)
#   WEB_PORT  host port for the dashboard        (default 3000)
#   API_PORT  port the API listens on internally (default 8000)
# Put a reverse proxy (Caddy/nginx) with TLS in front of the dashboard.

# Log rotation: keep at most 5 x 10 MB of logs per container
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-5}"

services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${API_PORT:-8000}
      # Key lives in the mounted secret, not the repo-relative path from .env
      SNOWFLAKE_PRIVATE_KEY_PATH: /run/secrets/rsa_key.p8
      APP_DB_PATH: /app/data/app.db
    volumes:
      - app-data:/app/data
      - ./secrets/rsa_key.p8:/run/secrets/rsa_key.p8:ro
    expose:
      - "${API_PORT:-8000}"
    logging: *default-logging

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 3000
      PY_API_URL: http://api:${API_PORT:-8000}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-haiku-4.5}
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    logging: *default-logging

volumes:
  app-data:
