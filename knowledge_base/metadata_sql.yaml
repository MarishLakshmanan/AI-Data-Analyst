  - name: DISTRIBUTION_CENTERS
    description: "The table contains records identifying distribution centers. Each record provides a distribution center’s name and geographic coordinates, including latitude and longitude."
    base_table:
      database: LOOKER
      schema: AI
      table: DISTRIBUTION_CENTERS
    primary_key:
      columns:
        - ID
    dimensions:
      - name: ID
        expr: ID
        data_type: "NUMBER(38,0)"
        access_modifier: public_access
        sample_values:
          - "1"
          - "2"
          - "3"
      - name: NAME
        expr: NAME
        data_type: VARCHAR(16777216)
        access_modifier: public_access
        sample_values:
          - Memphis TN
          - Chicago IL
          - Houston TX
    facts:
      - name: LATITUDE
        expr: LATITUDE
        data_type: "NUMBER(38,4)"
