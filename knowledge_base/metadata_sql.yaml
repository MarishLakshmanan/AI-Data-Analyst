  - name: "monthly signup cohort retention"
    sql: |-
      WITH cohorts AS (
        SELECT ID AS user_id, DATE_TRUNC('month', CREATED_AT) AS cohort_month
        FROM LOOKER.AI.USERS
      ),
      recent AS (
        SELECT DATEADD('month', -11, MAX(cohort_month)) AS first_month FROM cohorts
      ),
      sizes AS (
        SELECT cohort_month, COUNT(*) AS cohort_size FROM cohorts GROUP BY 1
      ),
      activity AS (
        SELECT DISTINCT USER_ID, DATE_TRUNC('month', CREATED_AT) AS activity_month
        FROM LOOKER.AI.ORDERS
      ),
      active AS (
        SELECT
          c.cohort_month,
          DATEDIFF('month', c.cohort_month, a.activity_month) AS months_since_signup,
          COUNT(DISTINCT c.user_id) AS active_users
        FROM cohorts AS c
        JOIN activity AS a ON a.USER_ID = c.user_id
        WHERE a.activity_month >= c.cohort_month
        GROUP BY 1, 2
      )
      SELECT
        a.cohort_month,
        a.months_since_signup,
        ROUND(a.active_users / s.cohort_size * 100, 1) AS retention_pct
      FROM active AS a
      JOIN sizes AS s ON s.cohort_month = a.cohort_month
      WHERE a.cohort_month >= (SELECT first_month FROM recent) AND a.months_since_signup <= 11
      ORDER BY 1, 2
    question: What is the monthly order retention of each signup cohort over the first 12 months?
    verified_by: drafted by Claude (executed successfully; not yet human-reviewed)
    use_as_onboarding_question: false
