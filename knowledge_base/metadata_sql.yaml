  - name: "latest month vs previous month revenue"
    sql: |-
      WITH monthly AS (
        SELECT DATE_TRUNC('month', CREATED_AT) AS month, SUM(SALE_PRICE) AS revenue
        FROM LOOKER.AI.ORDER_ITEMS
        WHERE STATUS NOT IN ('Cancelled', 'Returned')
        GROUP BY 1
      )
      SELECT revenue AS current_revenue, previous_revenue
      FROM (
        SELECT month, revenue, LAG(revenue) OVER (ORDER BY month) AS previous_revenue
        FROM monthly
      )
      QUALIFY ROW_NUMBER() OVER (ORDER BY month DESC) = 1
    question: How does revenue in the latest month compare to the previous month?
