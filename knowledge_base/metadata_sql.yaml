  - name: "month over month order change"
    sql: |-
      WITH monthly AS (
        SELECT DATE_TRUNC('month', CREATED_AT) AS month, COUNT(*) AS order_count
        FROM LOOKER.AI.ORDERS
        GROUP BY 1
      )
      SELECT
        month,
        order_count,
        LAG(order_count) OVER (ORDER BY month) AS previous_month_count,
        ROUND((order_count / NULLIF(LAG(order_count) OVER (ORDER BY month), 0) - 1) * 100, 1) AS pct_change
      FROM monthly
      ORDER BY month DESC
      LIMIT 12
    question: How have monthly orders changed compared with the previous month?
