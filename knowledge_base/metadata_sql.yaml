  - name: '"What are the top 3 categories that were sold the most and group them by the locations"'
    sql: |-
      WITH category_sales AS (
        SELECT
          p.category,
          u.country,
          COUNT(oi.id) AS total_sold
        FROM
          order_items AS oi
          INNER JOIN products AS p ON oi.product_id = p.id
          INNER JOIN users AS u ON oi.user_id = u.id
        GROUP BY
          p.category,
          u.country
      ),
      top_categories AS (
        SELECT
          category,
          SUM(total_sold) AS overall_sold
        FROM
          category_sales
        GROUP BY
          category
        ORDER BY
          overall_sold DESC NULLS LAST
        LIMIT
          3
      )
      SELECT
        cs.category,
        cs.country,
        cs.total_sold
      FROM
        category_sales AS cs
        INNER JOIN top_categories AS tc ON cs.category = tc.category
      ORDER BY
        tc.overall_sold DESC NULLS LAST,
        cs.category,
        cs.total_sold DESC NULLS LAST
