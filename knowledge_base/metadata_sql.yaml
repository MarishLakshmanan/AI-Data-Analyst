  - name: "\"Give me the top 10 most purchased product, with its name, id and from where the order was placed\""
    sql: |-
      WITH product_orders AS (
        SELECT
          oi.product_id,
          p.name AS product_name,
          u.city AS order_city,
          u.country AS order_country,
          COUNT(oi.id) AS purchase_count
        FROM
          order_items AS oi
          INNER JOIN products AS p ON oi.product_id = p.id
          INNER JOIN users AS u ON oi.user_id = u.id
        GROUP BY
          oi.product_id,
          p.name,
          u.city,
          u.country
      ),
      product_totals AS (
        SELECT
          product_id,
          product_name,
          SUM(purchase_count) AS total_purchases
        FROM
          product_orders
        GROUP BY
          product_id,
          product_name
        ORDER BY
          total_purchases DESC NULLS LAST
        LIMIT
          10
      )
      SELECT
        po.product_id,
        po.product_name,
        po.order_city,
        po.order_country,
        po.purchase_count
      FROM
        product_totals AS pt
        INNER JOIN product_orders AS po ON pt.product_id = po.product_id
      ORDER BY
        pt.total_purchases DESC NULLS LAST,
        po.purchase_count DESC NULLS LAST
