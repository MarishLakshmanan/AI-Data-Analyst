  - name: "browsing to purchase funnel"
    sql: |-
      WITH s AS (
        SELECT
          SESSION_ID,
          MAX(IFF(EVENT_TYPE = 'product', 1, 0)) AS viewed_product,
          MAX(IFF(EVENT_TYPE = 'cart', 1, 0)) AS added_to_cart,
          MAX(IFF(EVENT_TYPE = 'purchase', 1, 0)) AS purchased
        FROM LOOKER.AI.EVENTS
        GROUP BY SESSION_ID
      )
      SELECT * FROM (
        SELECT '1. Viewed a product' AS stage, COUNT_IF(viewed_product = 1) AS sessions FROM s
        UNION ALL
        SELECT '2. Added to cart', COUNT_IF(viewed_product = 1 AND added_to_cart = 1) FROM s
        UNION ALL
        SELECT '3. Purchased', COUNT_IF(viewed_product = 1 AND added_to_cart = 1 AND purchased = 1) FROM s
      )
      ORDER BY stage
    question: Show the funnel from viewing a product to adding it to the cart to purchasing, by sessions
